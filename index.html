<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tamid" />
    <meta name="theme-color" content="#0A1628" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>Tamid — Daily Tzedakah</title>
    <style>body{margin:0;background:#0A1628;-webkit-tap-highlight-color:transparent}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registered:', reg.scope);
            // Try to register periodic sync for daily reminders
            if ('periodicSync' in reg) {
              reg.periodicSync.register('tamid-daily-check', {
                minInterval: 24 * 60 * 60 * 1000 // 24 hours
              }).catch(e => console.log('Periodic sync not available:', e));
            }
          });
        });
      }
    </script>
  </body>
</html>
